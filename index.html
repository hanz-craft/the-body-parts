<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's learn Body Parts Game! 🎈</title>
    <style>
        /* =========================================================
           KID-FRIENDLY & CLASSROOM CSS STYLING
        ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka+One&display=swap');

        :root {
            --bg-color: #E0F6FF; 
            --p1-color: #FF90B3; /* Pink */
            --p2-color: #4ECDC4; /* Teal */
            --p3-color: #FFD700; /* Yellow */
            --p4-color: #9D4EDD; /* Purple */
            --text-dark: #333333;
            --white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka One', 'Comic Neue', cursive, sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* Screens */
        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .active { display: block; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Typography */
        h1 { font-size: 3.5rem; color: #FF6B8B; margin-bottom: 10px; }
        h2 { font-size: 2.5rem; background: var(--white); display: inline-block; padding: 10px 30px; border-radius: 50px; box-shadow: 0 8px 0px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Buttons */
        .btn {
            font-family: inherit;
            background-color: var(--white);
            color: var(--text-dark);
            border: 4px solid #ccc;
            padding: 20px 40px;
            font-size: 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s ease;
            margin: 10px;
            box-shadow: 0 8px 0px #ccc;
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 3px 0px #ccc; }
        .btn-start { background-color: #32CD32; border-color: #28A428; color: white; box-shadow: 0 8px 0px #28A428; }

        /* Setup Screen */
        .player-count-selector { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .player-btn { font-size: 3rem; width: 100px; height: 100px; border-radius: 20px; }

        /* Top Bar & Teacher Controls */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
        }
        .teacher-btn { background: none; border: none; font-size: 2.5rem; cursor: pointer; box-shadow: none; padding: 0; transition: transform 0.3s; }
        .teacher-btn:hover { transform: rotate(90deg); }

        /* Game Board */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .score-card {
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.5rem;
            border: 4px solid;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.5; /* Dimmed if not their turn */
            transition: 0.3s;
        }
        .score-card.active-turn { opacity: 1; transform: scale(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: var(--white);
            border-radius: 30px;
            padding: 20px;
            font-size: 5rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
            border: 6px solid transparent;
        }
        .card:active { transform: scale(0.95); }

        /* Turn Overlay (Big announcement) */
        #turn-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }
        .avatar-huge { font-size: 10rem; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Teacher Dashboard Overlay */
        #teacher-dash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .dash-panel { background: white; padding: 40px; border-radius: 30px; text-align: center; }

        .confetti { position: fixed; width: 15px; height: 15px; z-index: 1000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn" style="padding: 10px 20px; font-size: 1.5rem;" onclick="location.reload()">🏠 Home</button>
        <button class="teacher-btn" onclick="toggleTeacherDash()">⚙️</button>
    </div>

    <div id="home-screen" class="screen active">
        <h1>Play With Friends! 👫</h1>
        <h2>How many players?</h2>
        
        <div class="player-count-selector">
            <button class="btn player-btn" style="border-color: var(--p1-color); color: var(--p1-color);" onclick="setupGame(2)">2</button>
            <button class="btn player-btn" style="border-color: var(--p2-color); color: var(--p2-color);" onclick="setupGame(3)">3</button>
            <button class="btn player-btn" style="border-color: var(--p3-color); color: var(--p3-color);" onclick="setupGame(4)">4</button>
        </div>
        <p style="font-size: 1.5rem; color: #666;">Take turns passing the tablet or clicking the board!</p>
    </div>

    <div id="game-screen" class="screen">
        <div class="scoreboard" id="scoreboard">
            </div>
        
        <h2 id="question-text">Can you find the... ?</h2>
        
        <div class="grid-container" id="quiz-grid">
            </div>
    </div>

    <div id="turn-overlay">
        <div class="avatar-huge" id="turn-avatar">🐶</div>
        <h1 id="turn-text" style="font-size: 4rem;">Player 1's Turn!</h1>
    </div>

    <div id="teacher-dash">
        <div class="dash-panel">
            <h1 style="color: #333;">Teacher Dashboard 🍎</h1>
            <button class="btn" onclick="resetScores()">Reset Scores</button>
            <button class="btn" onclick="toggleMute()" id="mute-btn">Mute Audio: OFF</button>
            <button class="btn btn-start" onclick="toggleTeacherDash()">Close</button>
        </div>
    </div>

    <script>
        /* =========================================================
           GAME LOGIC & OFFLINE MULTIPLAYER
        ========================================================= */

        const bodyParts = [
            { name: "Eyes", emoji: "👀" }, { name: "Ears", emoji: "👂👂" },
            { name: "Nose", emoji: "👃" }, { name: "Mouth", emoji: "👄" },
            { name: "Teeth", emoji: "🦷" }, { name: "Tongue", emoji: "👅" },
            { name: "Hands", emoji: "🖐️🖐️" }, { name: "Feet", emoji: "🦶🦶" },
            { name: "Legs", emoji: "🦵🦵" }, { name: "Arms", emoji: "💪💪" }
        ];

        const playerProfiles = [
            { name: "Puppy", emoji: "🐶", color: "var(--p1-color)", id: 1 },
            { name: "Kitty", emoji: "🐱", color: "var(--p2-color)", id: 2 },
            { name: "Bunny", emoji: "🐰", color: "var(--p3-color)", id: 3 },
            { name: "Bear", emoji: "🐻", color: "var(--p4-color)", id: 4 }
        ];

        let activePlayers = [];
        let currentPlayerIndex = 0;
        let currentAnswer = "";
        let isMuted = false;
        let isWaitingForClick = false;

        // --- Audio & Voice ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'yay') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        function speak(text) {
            if (isMuted) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1.1; 
            utterance.rate = 0.9;  
            window.speechSynthesis.speak(utterance);
        }

        // --- Setup & Teacher Controls ---
        function toggleTeacherDash() {
            const dash = document.getElementById('teacher-dash');
            dash.style.display = dash.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = `Mute Audio: ${isMuted ? 'ON' : 'OFF'}`;
        }

        function resetScores() {
            activePlayers.forEach(p => p.score = 0);
            updateScoreboard();
            toggleTeacherDash();
        }

        function setupGame(numPlayers) {
            playSound('pop');
            activePlayers = playerProfiles.slice(0, numPlayers).map(p => ({ ...p, score: 0 }));
            currentPlayerIndex = 0;
            
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            buildScoreboard();
            startTurnPhase();
        }

        // --- Core Game Loop ---
        function buildScoreboard() {
            const board = document.getElementById('scoreboard');
            board.innerHTML = "";
            activePlayers.forEach((p, idx) => {
                board.innerHTML += `
                    <div class="score-card" id="score-p${idx}" style="border-color: ${p.color}; color: ${p.color};">
                        <span>${p.emoji}</span> <b id="pts-p${idx}">${p.score}</b> ⭐
                    </div>
                `;
            });
        }

        function updateScoreboard() {
            activePlayers.forEach((p, idx) => {
                document.getElementById(`pts-p${idx}`).innerText = p.score;
            });
        }

        function startTurnPhase() {
            isWaitingForClick = false;
            const player = activePlayers[currentPlayerIndex];
            
            // Highlight active player in scoreboard
            document.querySelectorAll('.score-card').forEach(el => el.classList.remove('active-turn'));
            document.getElementById(`score-p${currentPlayerIndex}`).classList.add('active-turn');

            // Show big turn overlay
            const overlay = document.getElementById('turn-overlay');
            document.getElementById('turn-avatar').innerText = player.emoji;
            document.getElementById('turn-text').innerText = `${player.name}'s Turn!`;
            document.getElementById('turn-text').style.color = player.color;
            overlay.style.display = 'flex';
            
            playSound('pop');
            speak(`${player.name}, it is your turn!`);

            // Hide overlay and load question after 2.5 seconds
            setTimeout(() => {
                overlay.style.display = 'none';
                loadQuestion(player);
            }, 2500);
        }

        function loadQuestion(player) {
            const grid = document.getElementById('quiz-grid');
            grid.innerHTML = "";

            // Select 4 random options
            const shuffled = [...bodyParts].sort(() => 0.5 - Math.random());
            const options = shuffled.slice(0, 4);
            const correctPart = options[Math.floor(Math.random() * options.length)];
            currentAnswer = correctPart.name;

            // Update UI
            document.getElementById('question-text').innerText = `Find the ${correctPart.name}!`;
            document.getElementById('question-text').style.color = player.color;
            speak(`Can you find the ${correctPart.name}?`);

            options.forEach(part => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = part.emoji;
                card.onclick = () => handleGuess(part.name, card, player);
                grid.appendChild(card);
            });
            
            isWaitingForClick = true;
        }

        function handleGuess(guessedName, cardElement, player) {
            if (!isWaitingForClick) return; // Prevent double clicks
            isWaitingForClick = false;

            if (guessedName === currentAnswer) {
                // Correct
                playSound('yay');
                speak("Great job!");
                cardElement.style.backgroundColor = "#32CD32"; // Green
                player.score++;
                updateScoreboard();
                fireConfetti();
                
                // Move to next player after delay
                setTimeout(nextPlayer, 2000);
            } else {
                // Wrong
                playSound('wrong');
                speak("Oops, that's not it.");
                cardElement.style.opacity = "0.3";
                
                // In classroom settings, usually we move to the next kid to keep the flow,
                // or let them try again. Let's move to next player to keep it fair.
                setTimeout(nextPlayer, 1500);
            }
        }

        function nextPlayer() {
            currentPlayerIndex++;
            if (currentPlayerIndex >= activePlayers.length) {
                currentPlayerIndex = 0; // Loop back to Player 1
            }
            startTurnPhase();
        }

        // --- Visual Effects ---
        function fireConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['#ff0a54', '#32CD32', '#FFD700', '#4ECDC4', '#9D4EDD'][Math.floor(Math.random() * 5)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }
    </script>
</body>
</html>
