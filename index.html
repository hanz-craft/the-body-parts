<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Magical Body Parts Game! 🎈</title>
    <style>
        /* =========================================================
           MAGICAL KINDERGARTEN CSS STYLING
        ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka+One&display=swap');

        :root {
            --bg-top: #87CEEB; /* Sky Blue */
            --bg-bottom: #E0F6FF; 
            --p1-color: #FF90B3; /* Soft Pink */
            --p2-color: #4ECDC4; /* Teal */
            --accent: #FFD700; /* Yellow */
            --success: #32CD32; /* Green */
            --text-dark: #333333;
            --white: #FFFFFF;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Fredoka One', 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            overflow: hidden; /* Keep magical elements inside */
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* -----------------------------------------
           MAGICAL BACKGROUND ANIMATIONS
        ----------------------------------------- */
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .floating-obj { position: absolute; animation-timing-function: linear; animation-iteration-count: infinite; }
        
        .cloud { font-size: 5rem; opacity: 0.8; animation: drift 20s infinite; }
        .balloon { font-size: 4rem; animation: floatUp 15s infinite; }
        .bird { font-size: 3rem; animation: flyRight 12s infinite; }
        .sun { font-size: 8rem; top: 10px; right: 20px; animation: spinSlow 30s infinite linear; }
        .rainbow { font-size: 10rem; top: 20px; left: 20px; opacity: 0.7; }
        .bubble { font-size: 2rem; opacity: 0.5; animation: floatUp 8s infinite ease-in; }
        .butterfly { font-size: 3rem; animation: flutter 10s infinite; }
        .sparkle { font-size: 2rem; animation: twinkle 2s infinite; }

        @keyframes drift { 0% { transform: translateX(-200px); } 100% { transform: translateX(110vw); } }
        @keyframes floatUp { 0% { transform: translateY(110vh) rotate(-10deg); } 100% { transform: translateY(-20vh) rotate(10deg); } }
        @keyframes flyRight { 0% { transform: translate(-100px, 20vh); } 50% { transform: translate(50vw, 15vh); } 100% { transform: translate(110vw, 25vh); } }
        @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes flutter { 0% { transform: translate(-50px, 50vh) rotate(0deg); } 50% { transform: translate(50vw, 30vh) rotate(20deg); } 100% { transform: translate(110vw, 40vh) rotate(-10deg); } }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* -----------------------------------------
           UI LAYOUT & SCREENS
        ----------------------------------------- */
        .screen {
            display: none; width: 100%; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; position: relative;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .active { display: flex; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        h1 { font-size: 4rem; color: var(--white); text-shadow: 4px 4px 0px #FF6B8B, 8px 8px 0px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        h2 { font-size: 2.5rem; background: var(--white); display: inline-block; padding: 15px 40px; border-radius: 50px; box-shadow: 0 8px 0px rgba(0,0,0,0.1); margin: 10px; text-align: center;}

        /* Inputs & Buttons */
        input.name-input {
            font-family: inherit; font-size: 2rem; padding: 15px; border-radius: 20px;
            border: 4px solid var(--accent); text-align: center; margin: 10px; width: 250px;
        }
        
        .btn {
            font-family: inherit; font-size: 2rem; padding: 20px 40px;
            border-radius: 50px; border: none; cursor: pointer;
            box-shadow: 0 10px 0px rgba(0,0,0,0.2); transition: all 0.2s; margin: 10px;
            background: var(--white); color: var(--text-dark); border: 4px solid #ccc;
        }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 15px 0px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(5px); box-shadow: 0 3px 0px rgba(0,0,0,0.2); }
        
        .btn-p1 { background: var(--p1-color); color: white; border-color: #D85A7F; box-shadow: 0 10px 0px #D85A7F; }
        .btn-p2 { background: var(--p2-color); color: white; border-color: #319795; box-shadow: 0 10px 0px #319795; }
        .btn-play { background: var(--success); color: white; border-color: #28A428; box-shadow: 0 10px 0px #28A428; font-size: 2.5rem; }

        /* -----------------------------------------
           SPLIT SCREEN GAMEPLAY
        ----------------------------------------- */
        .top-scoreboard {
            position: absolute; top: 0; width: 100%; display: flex; justify-content: space-around;
            padding: 15px; box-sizing: border-box; background: rgba(255,255,255,0.7); z-index: 20;
            border-bottom: 4px solid white;
        }
        .score-box { font-size: 2rem; font-weight: bold; padding: 10px 30px; border-radius: 30px; border: 4px solid white; transition: 0.3s; }
        .score-box.active-turn { transform: scale(1.15); box-shadow: 0 0 20px var(--accent); }

        .split-container { display: flex; width: 100%; height: 100%; padding-top: 80px; }
        .player-side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: 0.3s; }
        .player-side.inactive { opacity: 0.4; pointer-events: none; filter: grayscale(50%); }
        
        .side-left { border-right: 4px dashed white; }

        .question-box { font-size: 2.5rem; background: white; padding: 20px; border-radius: 30px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 90%; cursor: pointer;}
        .big-emoji { font-size: 6rem; margin: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* Grid for Quiz */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
        .opt-btn { font-size: 2rem; padding: 20px; border-radius: 20px; border: 4px solid white; background: white; cursor: pointer; box-shadow: 0 8px 0px #ccc; transition: 0.2s; }
        .opt-btn:active { transform: translateY(5px); box-shadow: 0 3px 0px #ccc; }

        /* Scramble Game */
        .scramble-slots { display: flex; gap: 10px; margin-bottom: 20px; height: 70px; background: rgba(255,255,255,0.5); padding: 10px; border-radius: 20px; }
        .slot { width: 60px; height: 60px; background: white; border-radius: 15px; border: 4px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; }
        .letter-bank { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .letter-btn { width: 65px; height: 65px; font-size: 2.5rem; background: var(--accent); border-radius: 15px; border: 4px solid white; cursor: pointer; box-shadow: 0 6px 0px #D4AF37; }
        .letter-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px #D4AF37; }

        /* Confetti */
        .confetti { position: fixed; width: 15px; height: 15px; z-index: 1000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
        
        .correct-star { position: absolute; font-size: 4rem; animation: starPop 1s forwards; pointer-events: none; z-index: 100; }
        @keyframes starPop { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 100% { transform: scale(2) rotate(180deg) translateY(-50px); opacity: 0; } }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            .side-left { border-right: none; border-bottom: 4px dashed white; }
            .question-box { font-size: 1.8rem; padding: 10px; }
            h1 { font-size: 2.5rem; }
            .top-scoreboard { position: relative; }
        }
    </style>
</head>
<body>

    <div class="bg-layer" id="bg-layer">
        <div class="floating-obj sun">☀️</div>
        <div class="floating-obj rainbow">🌈</div>
        <div class="floating-obj cloud" style="top: 10%; animation-duration: 25s;">☁️</div>
        <div class="floating-obj cloud" style="top: 40%; animation-duration: 18s; animation-delay: -5s; font-size: 4rem;">☁️</div>
        <div class="floating-obj balloon" style="left: 10%; animation-duration: 12s;">🎈</div>
        <div class="floating-obj balloon" style="left: 80%; animation-duration: 16s; font-size: 3rem;">🎈</div>
        <div class="floating-obj bird" style="animation-delay: 2s;">🐦</div>
        <div class="floating-obj butterfly" style="animation-delay: 4s;">🦋</div>
        <div class="floating-obj sparkle" style="top: 20%; left: 30%;">✨</div>
        <div class="floating-obj sparkle" style="top: 60%; left: 70%; animation-delay: 1s;">✨</div>
    </div>

    <div id="setup-screen" class="screen active">
        <h1>Welcome to the<br>Body Parts Game! 🌟</h1>
        <div style="background: rgba(255,255,255,0.6); padding: 30px; border-radius: 30px; text-align: center;">
            <h2>Who is playing?</h2><br>
            <input type="text" id="p1-name" class="name-input" value="Player 1" style="background: var(--p1-color); color: white;">
            <input type="text" id="p2-name" class="name-input" value="Player 2" style="background: var(--p2-color); color: white;">
            <br>
            <h2>Choose Mini Game!</h2><br>
            <button class="btn btn-p1" onclick="startGame('quiz')">🤔 Quiz Game</button>
            <button class="btn btn-p2" onclick="startGame('scramble')">🔠 Scramble Game</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="top-scoreboard">
            <div id="score-box-1" class="score-box" style="background: var(--p1-color); color: white;">
                <span id="p1-display">Player 1</span> ⭐ <span id="p1-score">0</span>
            </div>
            <div style="font-size: 2rem; font-weight: bold; background: white; padding: 10px 20px; border-radius: 20px;">
                Round <span id="round-display">1</span>/10
            </div>
            <div id="score-box-2" class="score-box" style="background: var(--p2-color); color: white;">
                <span id="p2-display">Player 2</span> ⭐ <span id="p2-score">0</span>
            </div>
        </div>

        <div class="split-container">
            <div class="player-side side-left" id="side-1">
                <div class="question-box" onclick="readQuestion(1)" id="q-box-1">
                    <div id="q-text-1">Where is the nose?</div>
                    <div class="big-emoji" id="q-emoji-1">👤</div>
                    <div style="font-size: 1rem; color: #888;">🔊 Tap to Listen</div>
                </div>
                <div id="game-area-1"></div> </div>

            <div class="player-side" id="side-2">
                <div class="question-box" onclick="readQuestion(2)" id="q-box-2">
                    <div id="q-text-2">Where is the nose?</div>
                    <div class="big-emoji" id="q-emoji-2">👤</div>
                    <div style="font-size: 1rem; color: #888;">🔊 Tap to Listen</div>
                </div>
                <div id="game-area-2"></div> </div>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <h1>Great Job! 🎉</h1>
        <h2 id="winner-text" style="font-size: 3rem;">Everyone Wins!</h2>
        <div style="display: flex; gap: 20px; margin: 20px;">
            <div class="score-box" style="background: var(--p1-color); color: white; padding: 20px 40px; font-size: 2.5rem;">
                <span id="final-p1-name">P1</span><br>⭐ <span id="final-p1-score">0</span>
            </div>
            <div class="score-box" style="background: var(--p2-color); color: white; padding: 20px 40px; font-size: 2.5rem;">
                <span id="final-p2-name">P2</span><br>⭐ <span id="final-p2-score">0</span>
            </div>
        </div>
        <button class="btn btn-play" onclick="location.reload()">Play Again! 🚀</button>
    </div>

    <script>
        /* =========================================================
           JAVASCRIPT LOGIC
        ========================================================= */
        
        // --- DATA ---
        const quizData = [
            { q: "What is it?", answer: "nose", emoji: "👃", opts: ["eyes", "ears", "nose", "mouth"] },
            { q: "What body part do we use to see?", answer: "eyes", emoji: "👀", opts: ["hands", "eyes", "feet", "hair"] },
            { q: "Can you name it?", answer: "hand", emoji: "🖐️", opts: ["foot", "hand", "knee", "ear"] },
            { q: "Touch the ears!", answer: "ears", emoji: "👂", opts: ["ears", "nose", "teeth", "tongue"] },
            { q: "Which one is the mouth?", answer: "mouth", emoji: "👄", opts: ["mouth", "eye", "neck", "leg"] },
            { q: "What body part do we use to walk?", answer: "feet", emoji: "🦶", opts: ["arms", "head", "feet", "shoulders"] },
            { q: "Find the teeth!", answer: "teeth", emoji: "🦷", opts: ["tongue", "teeth", "lips", "head"] },
            { q: "What is it?", answer: "leg", emoji: "🦵", opts: ["arm", "leg", "finger", "toe"] },
            { q: "Can you name it?", answer: "tongue", emoji: "👅", opts: ["teeth", "tongue", "cheek", "chin"] },
            { q: "Where is the arm?", answer: "arm", emoji: "💪", opts: ["leg", "foot", "arm", "hand"] }
        ];

        const scrambleWords = [
            { word: "NOSE", emoji: "👃" }, { word: "EYES", emoji: "👀" },
            { word: "HAND", emoji: "🖐️" }, { word: "FOOT", emoji: "🦶" },
            { word: "EARS", emoji: "👂" }, { word: "LEGS", emoji: "🦵" },
            { word: "ARMS", emoji: "💪" }, { word: "HEAD", emoji: "💆🏻‍♂️" },
            { word: "LIPS", emoji: "👄" }, { word: "KNEE", emoji: "🦵" }
        ];

        // --- STATE VARIABLES ---
        let gameMode = "";
        let p1 = { name: "Player 1", score: 0 };
        let p2 = { name: "Player 2", score: 0 };
        let currentRound = 1;
        const MAX_ROUNDS = 10;
        let activePlayer = 1; 
        let currentQuestionData = null;
        let isWaiting = false;

        // Scramble state
        let currentSpelledWord = "";
        
        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'yay') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.pitch = 1.2; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function readQuestion(playerNum) {
            if (playerNum === activePlayer) {
                playSound('pop');
                speak(currentQuestionData.q || currentQuestionData.word);
            }
        }

        // --- GAME FLOW ---
        function startGame(mode) {
            playSound('pop');
            gameMode = mode;
            p1.name = document.getElementById('p1-name').value || "Player 1";
            p2.name = document.getElementById('p2-name').value || "Player 2";
            
            document.getElementById('p1-display').innerText = p1.name;
            document.getElementById('p2-display').innerText = p2.name;
            
            // Randomize questions
            quizData.sort(() => 0.5 - Math.random());
            scrambleWords.sort(() => 0.5 - Math.random());

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            startRound();
        }

        function startRound() {
            if (currentRound > MAX_ROUNDS) {
                endGame();
                return;
            }
            isWaiting = false;
            document.getElementById('round-display').innerText = currentRound;
            
            // Update Active Side Visuals
            document.getElementById('side-1').classList.toggle('inactive', activePlayer !== 1);
            document.getElementById('side-2').classList.toggle('inactive', activePlayer !== 2);
            document.getElementById('score-box-1').classList.toggle('active-turn', activePlayer === 1);
            document.getElementById('score-box-2').classList.toggle('active-turn', activePlayer === 2);

            // Fetch Data
            if (gameMode === 'quiz') {
                currentQuestionData = quizData[currentRound - 1];
                buildQuizUI(activePlayer, currentQuestionData);
            } else {
                currentQuestionData = scrambleWords[currentRound - 1];
                buildScrambleUI(activePlayer, currentQuestionData);
            }

            // Auto-read for current player
            setTimeout(() => {
                const intro = `${activePlayer === 1 ? p1.name : p2.name}'s turn!`;
                speak(intro);
                setTimeout(() => speak(currentQuestionData.q || "Spell " + currentQuestionData.word), 1500);
            }, 500);
        }

        function showStar(e) {
            const star = document.createElement('div');
            star.innerText = "⭐";
            star.className = 'correct-star';
            star.style.left = (e.clientX - 30) + 'px';
            star.style.top = (e.clientY - 30) + 'px';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }

        function handleCorrect(e) {
            if (isWaiting) return;
            isWaiting = true;
            playSound('yay');
            if(e) showStar(e);
            
            if (activePlayer === 1) p1.score++;
            else p2.score++;
            
            document.getElementById('p1-score').innerText = p1.score;
            document.getElementById('p2-score').innerText = p2.score;
            
            speak("Great job!");
            
            setTimeout(() => {
                currentRound++;
                activePlayer = activePlayer === 1 ? 2 : 1;
                startRound();
            }, 2000);
        }

        function handleWrong() {
            if (isWaiting) return;
            playSound('wrong');
            speak("Try again!");
        }

        function endGame() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');
            
            document.getElementById('final-p1-name').innerText = p1.name;
            document.getElementById('final-p2-name').innerText = p2.name;
            document.getElementById('final-p1-score').innerText = p1.score;
            document.getElementById('final-p2-score').innerText = p2.score;

            const winText = document.getElementById('winner-text');
            if (p1.score > p2.score) winText.innerText = `${p1.name} Wins! 🏆`;
            else if (p2.score > p1.score) winText.innerText = `${p2.name} Wins! 🏆`;
            else winText.innerText = "It's a Tie! 🤝 You are both stars!";

            speak(winText.innerText);
            fireConfetti();
        }

        // --- MINI GAME 1: QUIZ ---
        function buildQuizUI(player, data) {
            document.getElementById(`q-text-${player}`).innerText = data.q;
            document.getElementById(`q-emoji-${player}`).innerText = data.emoji;
            document.getElementById(`q-text-${player === 1 ? 2 : 1}`).innerText = "Wait your turn...";
            document.getElementById(`q-emoji-${player === 1 ? 2 : 1}`).innerText = "⏳";
            document.getElementById(`game-area-${player === 1 ? 2 : 1}`).innerHTML = "";

            const area = document.getElementById(`game-area-${player}`);
            area.innerHTML = "";
            const grid = document.createElement('div');
            grid.className = "options-grid";
            
            data.opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = (e) => {
                    if(isWaiting) return;
                    if (opt === data.answer) {
                        btn.style.backgroundColor = "var(--success)";
                        btn.style.color = "white";
                        handleCorrect(e);
                    } else {
                        btn.style.opacity = "0.5";
                        handleWrong();
                    }
                };
                grid.appendChild(btn);
            });
            area.appendChild(grid);
        }

        // --- MINI GAME 2: SCRAMBLE ---
        function buildScrambleUI(player, data) {
            document.getElementById(`q-text-${player}`).innerText = "Spell the word!";
            document.getElementById(`q-emoji-${player}`).innerText = data.emoji;
            document.getElementById(`q-text-${player === 1 ? 2 : 1}`).innerText = "Wait your turn...";
            document.getElementById(`q-emoji-${player === 1 ? 2 : 1}`).innerText = "⏳";
            document.getElementById(`game-area-${player === 1 ? 2 : 1}`).innerHTML = "";

            currentSpelledWord = "";
            const word = data.word;
            const shuffled = word.split('').sort(() => 0.5 - Math.random());
            
            const area = document.getElementById(`game-area-${player}`);
            area.innerHTML = "";

            // Slots
            const slotsContainer = document.createElement('div');
            slotsContainer.className = "scramble-slots";
            for(let i=0; i<word.length; i++) {
                const slot = document.createElement('div');
                slot.className = "slot";
                slot.id = `slot-${player}-${i}`;
                slotsContainer.appendChild(slot);
            }
            area.appendChild(slotsContainer);

            // Bank
            const bank = document.createElement('div');
            bank.className = "letter-bank";
            
            shuffled.forEach((letter, index) => {
                const btn = document.createElement('button');
                btn.className = "letter-btn";
                btn.innerText = letter;
                btn.onclick = (e) => {
                    if (isWaiting || btn.disabled) return;
                    playSound('pop');
                    
                    // Put letter in next available slot
                    const slot = document.getElementById(`slot-${player}-${currentSpelledWord.length}`);
                    slot.innerText = letter;
                    btn.style.opacity = "0";
                    btn.disabled = true;
                    
                    currentSpelledWord += letter;
                    
                    if (currentSpelledWord.length === word.length) {
                        if (currentSpelledWord === word) {
                            slotsContainer.style.backgroundColor = "var(--success)";
                            handleCorrect(e);
                        } else {
                            handleWrong();
                            // Reset if wrong
                            setTimeout(() => buildScrambleUI(player, data), 1000);
                        }
                    }
                };
                bank.appendChild(btn);
            });
            area.appendChild(bank);
        }

        // --- EFFECTS ---
        function fireConfetti() {
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.classList.add('confetti');
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = ['#ff0a54', '#32CD32', '#FFD700', '#4ECDC4', '#9D4EDD'][Math.floor(Math.random() * 5)];
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(c);
            }
        }
    </script>
</body>
</html>
