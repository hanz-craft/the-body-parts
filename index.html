
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Learn Body Parts! 🎈</title>
    <style>
        /* =========================================================
           KID-FRIENDLY CSS STYLING
           Bright colors, soft shadows, rounded corners, bouncy animations!
        ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka+One&display=swap');

        :root {
            --bg-color: #87CEEB; /* Sky Blue */
            --primary: #FF90B3;  /* Soft Pink */
            --secondary: #FFD700; /* Bright Yellow */
            --success: #32CD32;   /* Happy Green */
            --text-dark: #333333;
            --white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka One', 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(180deg, var(--bg-color) 0%, #E0F6FF 100%);
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            user-select: none; /* Prevents accidental text selection */
        }

        /* Floating Background Elements */
        .bg-shape {
            position: absolute;
            z-index: -1;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Screen Management */
        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active {
            display: block;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Typography */
        h1 {
            font-size: 3.5rem;
            color: var(--white);
            text-shadow: 4px 4px 0px #FF6B8B, 8px 8px 0px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        h2 {
            font-size: 2.5rem;
            color: var(--primary);
            background: var(--white);
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 0px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        /* Buttons */
        .btn {
            font-family: inherit;
            background-color: var(--secondary);
            color: var(--text-dark);
            border: none;
            padding: 20px 40px;
            font-size: 2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0px #D4AF37;
            transition: all 0.2s ease;
            margin: 15px;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 0px #D4AF37;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0px #D4AF37;
        }

        .btn-blue { background-color: #4ECDC4; box-shadow: 0 10px 0px #319795; color: white; }
        .btn-blue:hover { box-shadow: 0 15px 0px #319795; }
        .btn-blue:active { box-shadow: 0 2px 0px #319795; }

        .btn-pink { background-color: var(--primary); box-shadow: 0 10px 0px #D85A7F; color: white; }
        .btn-pink:hover { box-shadow: 0 15px 0px #D85A7F; }
        .btn-pink:active { box-shadow: 0 2px 0px #D85A7F; }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .btn-back {
            background-color: var(--white);
            color: var(--text-dark);
            font-size: 1.5rem;
            padding: 10px 20px;
            box-shadow: 0 5px 0px #ccc;
        }

        /* Grids for Learning & Playing */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 30px;
            padding: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
            border: 4px solid transparent;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--secondary);
        }

        .card .emoji {
            font-size: 5rem;
            margin-bottom: 10px;
            display: block;
        }

        /* Confetti Effect */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            background-color: #f2d74e;
            z-index: 1000;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.8rem; }
            .btn { font-size: 1.5rem; padding: 15px 30px; }
            .card .emoji { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-shape" style="top: 10%; left: 10%; font-size: 4rem;">☁️</div>
    <div class="bg-shape" style="top: 20%; right: 15%; font-size: 3rem;">⭐</div>
    <div class="bg-shape" style="bottom: 10%; left: 20%; font-size: 5rem;">🎈</div>

    <div id="home-screen" class="screen active">
        <div style="font-size: 8rem; animation: float 3s infinite;">🤖</div>
        <h1>Let's Learn<br>Body Parts!</h1>
        <button class="btn" onclick="goToScreen('menu-screen')">Start Learning! 🚀</button>
    </div>

    <div id="menu-screen" class="screen">
        <div class="nav-bar">
            <button class="btn btn-back" onclick="goToScreen('home-screen')">⬅️ Back</button>
        </div>
        <h2>Choose a Game!</h2>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button class="btn btn-blue" onclick="startPlayAlone()">👤 Play Alone</button>
            <button class="btn btn-pink" onclick="startRobotMode()">🤖 Play with Robot</button>
            <button class="btn" onclick="alert('Multiplayer Mode coming soon! For now, try playing with the Robot!')">👫 Play with Friends</button>
        </div>
    </div>

    <div id="play-alone-screen" class="screen">
        <div class="nav-bar">
            <button class="btn btn-back" onclick="goToScreen('menu-screen')">⬅️ Menu</button>
        </div>
        <h2>Tap to Listen! 👂</h2>
        <div class="grid-container" id="learning-grid">
            </div>
    </div>

    <div id="robot-screen" class="screen">
        <div class="nav-bar">
            <button class="btn btn-back" onclick="goToScreen('menu-screen')">⬅️ Menu</button>
            <div style="font-size: 2rem; background: white; padding: 5px 20px; border-radius: 20px; color: #FF90B3;">
                ⭐ <span id="score-display">0</span>
            </div>
        </div>
        
        <div style="font-size: 6rem; margin: 10px 0; animation: float 2s infinite;">🤖</div>
        <h2 id="robot-question">Can you find the... ?</h2>
        
        <div class="grid-container" id="quiz-grid">
            </div>
    </div>

    <script>
        /* =========================================================
           JAVASCRIPT LOGIC
           Handles Navigation, Web Audio (Sounds), TTS (Voice), and Games
        ========================================================= */

        // Body Parts Database (Editable!)
        const bodyParts = [
            { name: "Eyes", emoji: "👀" },
            { name: "Ears", emoji: "👂👂" },
            { name: "Nose", emoji: "👃" },
            { name: "Mouth", emoji: "👄" },
            { name: "Teeth", emoji: "🦷" },
            { name: "Tongue", emoji: "👅" },
            { name: "Hands", emoji: "🖐️🖐️" },
            { name: "Arms", emoji: "💪💪" },
            { name: "Legs", emoji: "🦵🦵" },
            { name: "Feet", emoji: "🦶🦶" }
        ];

        let currentQuizAnswer = "";
        let score = 0;

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'yay') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Text to Speech (Robot Voice)
        function speak(text) {
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1.2; // Slightly higher pitch for a cute robot voice
            utterance.rate = 0.9;  // Slightly slower for kids
            window.speechSynthesis.speak(utterance);
        }

        // --- Screen Navigation ---
        function goToScreen(screenId) {
            playSound('pop');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- Play Alone Mode ---
        function startPlayAlone() {
            goToScreen('play-alone-screen');
            const grid = document.getElementById('learning-grid');
            grid.innerHTML = ""; // Clear existing

            bodyParts.forEach(part => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span class="emoji">${part.emoji}</span> <b>${part.name}</b>`;
                card.onclick = () => {
                    playSound('pop');
                    speak(part.name);
                    // Add a tiny bounce animation on click
                    card.style.transform = "scale(0.9)";
                    setTimeout(() => card.style.transform = "scale(1)", 150);
                };
                grid.appendChild(card);
            });
        }

        // --- Play with Robot Mode (Quiz) ---
        function startRobotMode() {
            score = 0;
            document.getElementById('score-display').innerText = score;
            goToScreen('robot-screen');
            generateQuiz();
        }

        function generateQuiz() {
            const grid = document.getElementById('quiz-grid');
            grid.innerHTML = "";

            // Pick 4 random parts
            const shuffled = [...bodyParts].sort(() => 0.5 - Math.random());
            const options = shuffled.slice(0, 4);
            
            // Pick 1 as the correct answer
            const correctPart = options[Math.floor(Math.random() * options.length)];
            currentQuizAnswer = correctPart.name;

            // Update UI and speak
            document.getElementById('robot-question').innerText = `Can you find the ${correctPart.name}?`;
            setTimeout(() => speak(`Can you find the ${correctPart.name}?`), 300);

            // Create buttons
            options.forEach(part => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<span class="emoji">${part.emoji}</span>`;
                card.onclick = () => checkAnswer(part.name, card);
                grid.appendChild(card);
            });
        }

        function checkAnswer(selectedName, cardElement) {
            if (selectedName === currentQuizAnswer) {
                // Correct!
                playSound('yay');
                speak("Great job!");
                score++;
                document.getElementById('score-display').innerText = score;
                cardElement.style.backgroundColor = "var(--success)";
                fireConfetti();
                
                // Wait a second, then load next question
                setTimeout(() => {
                    if(score >= 5) {
                        endGame();
                    } else {
                        generateQuiz();
                    }
                }, 1500);

            } else {
                // Wrong
                playSound('wrong');
                speak("Oops! Try again.");
                cardElement.style.opacity = "0.5";
                cardElement.style.pointerEvents = "none";
            }
        }

        function endGame() {
            speak("You did amazing! You are a superstar!");
            fireConfetti();
            document.getElementById('robot-question').innerText = "You are a Superstar! 🌟";
            document.getElementById('quiz-grid').innerHTML = `
                <button class="btn btn-pink" onclick="startRobotMode()">Play Again!</button>
            `;
        }

        // --- Confetti Animation ---
        function fireConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f9bec7'][Math.floor(Math.random() * 6)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
    </script>
</body>
</html>
